name: Build Veil APK and Windows EXE

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android APK
            runner: ubuntu-latest
            gradleTask: :composeApp:assembleDebug
            artifactPath: composeApp/build/outputs/apk/debug/*.apk
            artifactName: veil-android-apk
          - target: Windows EXE
            runner: windows-latest
            gradleTask: :composeApp:packageReleaseExe
            artifactPath: composeApp/build/compose/binaries/main-release/exe/*.exe
            artifactName: veil-windows-exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install WiX Toolset (Windows package prerequisite)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Build APK
        if: matrix.target == 'Android APK'
        shell: bash
        run: gradle ${{ matrix.gradleTask }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build Windows installer EXE
        if: matrix.target == 'Windows EXE'
        shell: pwsh
        run: |
          gradle ${{ matrix.gradleTask }} --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Surface build error in check annotations
        if: failure()
        shell: pwsh
        run: |
          $tail = (Get-Content build.log -Tail 35) -join ' | '
          $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Gradle build output::$tail"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 30
