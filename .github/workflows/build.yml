name: Build Serein prototype
on:
  push:
    branches: [arena/73cb41a7-djdd]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            task: :composeApp:assembleDebug
            files: composeApp/build/outputs/apk/debug/*.apk
          - platform: linux
            os: ubuntu-24.04
            task: :composeApp:packageDistributionForCurrentOS
            files: composeApp/build/compose/binaries/main/deb/*.deb
          - platform: windows
            os: windows-latest
            task: :composeApp:packageDistributionForCurrentOS
            files: composeApp/build/compose/binaries/main/exe/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        shell: bash
        run: |
          ./gradlew ${{ matrix.task }} --stacktrace > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            grep -E -A 12 'FAILURE:|What went wrong:|^e:|^> |SDK location|License|Could not|error:' build.log | tail -n 60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: serein-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
