name: Build Serein prototype
on:
  push:
    branches: [arena/73cb41a7-djdd]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            task: :composeApp:assembleDebug
            files: composeApp/build/outputs/apk/debug/*.apk
          - platform: linux
            os: ubuntu-24.04
            task: :composeApp:packageDistributionForCurrentOS
            files: composeApp/build/compose/binaries/main/deb/*.deb
          - platform: macos
            os: macos-15
            task: :composeApp:packageDistributionForCurrentOS
            files: composeApp/build/compose/binaries/main/dmg/*.dmg
          - platform: windows
            os: windows-latest
            task: :composeApp:packageDistributionForCurrentOS
            files: composeApp/build/compose/binaries/main/exe/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests
        if: matrix.platform != 'android'
        run: ./gradlew :composeApp:desktopTest
      - name: Enable Android emulator acceleration
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Android emulator smoke test
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :composeApp:connectedDebugAndroidTest
      - name: Package
        shell: bash
        run: |
          set +e
          ./gradlew ${{ matrix.task }} --stacktrace > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            (grep -E '^e:|^error:|Duplicate class|found in modules|\.kt:[0-9]+:[0-9]+:.*error' build.log | head -n 8; awk '/^FAILURE: Build failed/{flag=1} flag && n++<5 {print}' build.log) | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: serein-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
